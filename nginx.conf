server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── SEO 301 Redirects for Legacy URLs ──────────────────────────────
    rewrite ^/index\.php$ / permanent;
    rewrite ^/about/?$ / permanent;
    rewrite ^/why-fresh-food/?$ / permanent;
    rewrite ^/testimonial/.*$ / permanent;


    # ── API proxy to backend container ───────────────────────────────
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for AI requests
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── Prevent Cloudflare from injecting beacon/rocket-loader scripts ──
    # Cloudflare's Browser Insights injects beacon.min.js with a stale
    # integrity hash, causing SRI failures in the browser console.
    # This header tells Cloudflare not to modify the HTML response body.
    add_header X-No-Transform "1" always;

    # ── index.html — never cache ──────────────────────────────────────
    # This is the entry point. If the browser always fetches a fresh copy,
    # it will pick up the new hashed asset filenames on every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        try_files $uri =404;
    }

    # ── Service worker — never cache, never transform ─────────────────
    # The SW must always be fresh so the browser can detect a new version.
    # no-transform + X-No-Transform tell Cloudflare (and any CDN) not to
    # minify or inject code into sw.js — any byte change makes the browser
    # think a new SW is available, causing an infinite install/activate loop.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate, no-transform" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Service-Worker-Allowed "/" always;
        add_header X-No-Transform "1" always;
        etag off;
        try_files $uri =404;
    }

    # ── version.json — never cache ────────────────────────────────────
    # Generated fresh on every build. The SW polls this to detect deploys.
    # Must never be cached by Cloudflare or the browser.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Content-Type "application/json" always;
        etag off;
        try_files $uri =404;
    }

    # ── PWA manifest — short cache ────────────────────────────────────
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400"; # 1 day
        try_files $uri =404;
    }

    # ── Hashed assets — cache forever ────────────────────────────────
    # Vite outputs files like /assets/index-Ab3Cd4Ef.js
    # The hash changes on every build, so it's safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Sitemap & XML files ───────────────────────────────────────────
    location ~* \.xml$ {
        types { }
        default_type "application/xml; charset=utf-8";
        add_header Cache-Control "public, max-age=86400"; # 1 day
        try_files $uri =404;
    }

    # ── Video files — range requests required for Firefox ────────────
    # Firefox needs Accept-Ranges + proper byte-range responses to parse
    # MP4 metadata. Without this it throws NS_ERROR_DOM_MEDIA_METADATA_ERR.
    location ~* \.(mp4|webm|ogg)$ {
        add_header Cache-Control "public, max-age=2592000"; # 30 days
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # ── Static assets in /public (icons, images) — long cache ────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        add_header Cache-Control "public, max-age=2592000"; # 30 days
        try_files $uri =404;
    }

    # ── SPA fallback — all other routes serve index.html ─────────────
    # Uses an internal rewrite so the request hits location = /index.html
    # and picks up its no-cache headers correctly.
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        etag off;
        rewrite ^ /index.html break;
    }
}
